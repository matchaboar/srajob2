# Minutes the Spidercloud job-detail activity is allowed to run before the lease is considered failed.
# Increased from 4 to accommodate larger batches and concurrent storage
spidercloud_job_details_timeout_minutes: 8

# Number of Spidercloud job-detail URLs to lease and process per batch; larger batches increase throughput but also per-activity time.
# Increased from 10 to 20 for better efficiency with pipeline parallelism
spidercloud_job_details_batch_size: 20

# Number of Spidercloud listing URLs to lease per workflow run.
spidercloud_listing_batch_size: 1

# Max concurrent Spidercloud requests per job-detail batch. Set to 1 for sequential processing.
# Increased from 4 to 10 to better utilize CPU cores and parallelize storage
# Also controls concurrent storage operations in batch_store_scrapes_background
spidercloud_job_details_concurrency: 10

# Minutes after which a leased Spidercloud job-detail URL is considered stale and automatically released from "processing"
# back to "pending" so the workflow can re-lease it. This prevents stuck rows from blocking future batches.
# Increased from 5 to 10 to accommodate larger batches
spidercloud_job_details_processing_expire_minutes: 10

# Timeout (seconds) for per-URL job detail scrapes.
spidercloud_http_timeout_seconds: 60

# Timeout (seconds) for listing page fetches (longer than per-URL to allow full page loads).
spidercloud_listing_timeout_seconds: 300

# Number of Temporal worker processes for general scraping tasks.
temporal_general_worker_count: 6

# Number of Temporal worker processes dedicated to Spidercloud job-details.
# Increased from 6 to 8 to increase throughput while staying near Convex 128 action limit
# 8 workers × 10 concurrent storage × 2 Convex calls = ~160 peak (Convex auto-enqueues excess)
temporal_job_details_worker_count: 8

# Number of Temporal worker processes dedicated to Spidercloud listing URLs.
temporal_listing_worker_count: 4
