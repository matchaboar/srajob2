[tool.uv.workspace]
members = ["job_scrape_application"]

[tool.uv.sources]
job-scrape-application = { workspace = true }

[project]
name = "srajob"
version = "0.1.0"
description = "Job board with scraping on scheduled intervals using Temporal.io"
readme = "README.md"
authors = [{ name = "matchaboar", email = "matchaboar@email.com" }]
requires-python = "==3.13.*"
dependencies = [
    "job-scrape-application",
    "convex>=0.7.0",
    "dbos>=2.7.0",
    "fetchfox-sdk>=1.0.1",
    "firecrawl>=4.8.0",
    "httpx>=0.28.1",
    "msgspec>=0.20.0",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "orjson>=3.11.5",
    "posthog>=3.7.0",
    "pydantic>=2.11.7",
    "pytest-xdist>=3.8.0",
    "textual>=0.89.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "spider-client>=0.1.82",
    "temporalio==1.17.0",
    "pytest-once>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.1.0"]
ai = []

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "green>=4.0.2",
    "psutil>=7.1.3",
    "pyright>=1.1.407",
    "pytest-profiling>=1.8.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.12.8",
]
