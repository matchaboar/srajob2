[tool.uv.workspace]
members = ["job_scrape_application"]

[tool.uv.sources]
job-scrape-application = { workspace = true }

[project]
name = "srajob"
version = "0.1.0"
description = "Job board with scraping on scheduled intervals using Temporal.io"
readme = "README.md"
authors = [{ name = "matchaboar", email = "matchaboar@email.com" }]
requires-python = "==3.13.*"
dependencies = [
    "job-scrape-application",
    "convex>=0.7.0",
    "dbos>=2.7.0",
    "fetchfox-sdk>=1.0.1",
    "firecrawl>=4.8.0",
    "httpx>=0.28.1",
    "msgspec>=0.20.0",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "orjson>=3.11.5",
    "posthog>=3.7.0",
    "pydantic>=2.11.7",
    "pytest-xdist>=3.8.0",
    "textual>=0.89.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "spider-client>=0.1.82",
    "temporalio==1.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.1.0"]
ai = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files (used for re-exporting)
"__init__.py" = ["F401", "F811"]
"*/__init__.py" = ["F401", "F811"]
"**/__init__.py" = ["F401", "F811"]
"job_scrape_application/**/__init__.py" = ["F401", "F811"]
# Allow Convex imports in test infrastructure (lazy imports for fixtures)
"job_scrape_application/workflows/core/*.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-n auto"
norecursedirs = ["_archive", ".*", "build", "dist", "*.egg", "venv", ".venv"]

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "green>=4.0.2",
    "pyright>=1.1.407",
    "ruff>=0.12.8",
]
