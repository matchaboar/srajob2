# Assertion file for Greenhouse support page listing extraction
# Tests that invalid Greenhouse URLs are filtered out during listing extraction

site_id: greenhouse_support_page
listing_url: https://support.greenhouse.io/hc/en-us

expected:
  # Valid job URLs that should be extracted (3 total):
  # 1. https://boards.greenhouse.io/lyft/jobs/1234567
  # 2. https://job-boards.greenhouse.io/stripe/jobs/7654321
  # 3. https://careers.airbnb.com/positions?gh_jid=9876543
  # 4. https://boards-api.greenhouse.io/v1/boards/stripe/jobs/7654321
  url_count_min: 3
  url_count_max: 4

  # All extracted URLs should match job board patterns
  url_pattern: "(boards\\.greenhouse\\.io|job-boards\\.greenhouse\\.io|boards-api\\.greenhouse\\.io|gh_jid)"

  # Handler should be detected as Greenhouse
  handler: GreenhouseHandler

  # URLs that should NOT be extracted (documented for clarity):
  # - https://support.greenhouse.io/* (support site)
  # - https://learn.greenhouse.io/* (learning site)
  # - https://my.greenhouse.io/* (authentication)
  # - https://www.greenhouse.com/* (marketing)
  # - https://job-seekers.cdn.greenhouse.io/* (CDN assets)
  # - https://api.greenhouse.io/v1/boards/*/jobs (listing API, not detail)
  no_invalid_urls: true

invalid_url_patterns:
  - "learn\\.greenhouse\\.io"
  - "support\\.greenhouse\\.io"
  - "my\\.greenhouse\\.io"
  - "www\\.greenhouse\\.(io|com)"
  - "cdn\\.greenhouse\\.io"
  - "\\.css$"
  - "\\.js$"
  - "/auth/"
  - "/login"
  - "/sign_in"
